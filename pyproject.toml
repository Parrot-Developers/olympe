[project]
name = "parrot-olympe"
version = "0.0.0"  # the actual version is set by the release CI job
description = "Python controller library for Parrot Drones"
readme.file = "README.md"
readme.content-type = "text/markdown"
requires-python = ">=3.9"
license.text = "BSD 3-Clause Modification"
license.file = "LICENSE.md"
keywords = ["uav", "parrot", "drones", "parrot-drones"]
authors = [
  {name = "Meryl Claussmann"}, {name = "Nicolas Dessart"}
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "License :: OSI Approved",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
  "Topic :: Scientific/Engineering"
]

dependencies = [
    "h11",
    "numpy",
    "protobuf==3.19.4",
    "pycryptodomex",
    "tzlocal<4.0",
    "wsproto"
]

[project.optional-dependencies]
debug = [
    "black"
]

rendering = [
    "PyOpenGL",
    "PyOpenGL-accelerate",
    "PySDL2"
]

doc = [
    "PyYAML",
    "Sphinx",
    "blockdiag",
    "furo",
    "seqdiag",
    "sphinx-copybutton",
    "sphinxcontrib-seqdiag"
]

tests = [
    "pytest"
]

[project.urls]
homepage = "https://developer.parrot.com/"
documentation = "https://developer.parrot.com/docs/olympe/index.html"
repository = "https://github.com/Parrot-Developers/olympe"

[project.scripts]
olympe = "olympe.app:main"

[tool.alchemy]
top-levels = [
    "olympe",
    "olympe_deps",
    "olympe_protobuf",
    "arsdkparser.py",
    "arsdk",
    "logness",
    "ulog.py",
    "_ulog"
]

# Alchemy is not (yet) a python build system backend (See PEP 517 / PEP 518)
